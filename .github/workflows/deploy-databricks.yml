name: Deploy and run Silver classification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Databricks target
        required: true
        type: choice
        options:
          - development
          - qa
          - production
        default: development
      enable_ai:
        description: Required for chapter organization and exercise splitting
        required: true
        type: boolean
        default: true
      max_pages_per_window:
        description: Maximum pages in one AI analysis window
        required: true
        type: string
        default: "15"
      window_overlap_pages:
        description: Pages repeated between adjacent windows
        required: true
        type: string
        default: "2"
      max_window_characters:
        description: Maximum Markdown characters per analysis window
        required: true
        type: string
        default: "40000"

permissions:
  contents: read

concurrency:
  group: markdown-silver-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Silver job to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build Python wheel
        run: python -m build --wheel

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks authentication configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            DATABRICKS_HOST
            DATABRICKS_CLIENT_ID
            DATABRICKS_CLIENT_SECRET
            DATABRICKS_AUTH_TYPE
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is empty."
              exit 1
            fi
          done

          if [[ ! "$DATABRICKS_HOST" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DATABRICKS_HOST has an invalid format."
            exit 1
          fi

          max_pages='${{ inputs.max_pages_per_window }}'
          overlap='${{ inputs.window_overlap_pages }}'
          max_characters='${{ inputs.max_window_characters }}'
          if [[ ! "$max_pages" =~ ^[0-9]+$ ]] || (( max_pages < 1 )); then
            echo "::error::max_pages_per_window must be a positive integer."
            exit 1
          fi
          if [[ ! "$overlap" =~ ^[0-9]+$ ]] || (( overlap >= max_pages )); then
            echo "::error::window_overlap_pages must be smaller than max_pages_per_window."
            exit 1
          fi
          if [[ ! "$max_characters" =~ ^[0-9]+$ ]] || (( max_characters < 1000 )); then
            echo "::error::max_window_characters must be at least 1000."
            exit 1
          fi

          echo "Databricks host: $DATABRICKS_HOST"
          echo "Client ID length: ${#DATABRICKS_CLIENT_ID}"
          echo "Client secret length: ${#DATABRICKS_CLIENT_SECRET}"
          echo "Authentication type: $DATABRICKS_AUTH_TYPE"
          echo "Secret values were not displayed."

      - name: Verify Databricks OAuth authentication
        shell: bash
        run: |
          set -euo pipefail
          databricks auth describe
          databricks current-user me --output json

      - name: Validate bundle
        run: |
          databricks bundle validate \
            --target "${{ inputs.environment }}" \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="enable_ai=${{ inputs.enable_ai }}" \
            --var="max_pages_per_window=${{ inputs.max_pages_per_window }}" \
            --var="window_overlap_pages=${{ inputs.window_overlap_pages }}" \
            --var="max_window_characters=${{ inputs.max_window_characters }}"

      - name: Deploy bundle
        run: |
          databricks bundle deploy \
            --target "${{ inputs.environment }}" \
            --auto-approve \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="enable_ai=${{ inputs.enable_ai }}" \
            --var="max_pages_per_window=${{ inputs.max_pages_per_window }}" \
            --var="window_overlap_pages=${{ inputs.window_overlap_pages }}" \
            --var="max_window_characters=${{ inputs.max_window_characters }}"

      - name: Run Silver job
        run: |
          databricks bundle run markdown_silver_classification \
            --target "${{ inputs.environment }}" \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="enable_ai=${{ inputs.enable_ai }}" \
            --var="max_pages_per_window=${{ inputs.max_pages_per_window }}" \
            --var="window_overlap_pages=${{ inputs.window_overlap_pages }}" \
            --var="max_window_characters=${{ inputs.max_window_characters }}"
