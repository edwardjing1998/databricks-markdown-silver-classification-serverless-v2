name: Deploy and run Silver page classification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Databricks target
        required: true
        type: choice
        options:
          - development
          - qa
          - production
        default: development

      max_pages_per_window:
        description: Maximum related pages sent in one AI request (1-20)
        required: true
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: markdown-page-classification-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and run ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # This selects the matching GitHub Environment:
    # development, qa, or production.
    environment: ${{ inputs.environment }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          pytest

      - name: Build Python wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate GitHub configuration
        shell: bash
        env:
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
          DATABRICKS_BRONZE_SCHEMA: ${{ vars.DATABRICKS_BRONZE_SCHEMA }}
          DATABRICKS_SILVER_SCHEMA: ${{ vars.DATABRICKS_SILVER_SCHEMA }}
          DATABRICKS_MODEL_ENDPOINT: ${{ vars.DATABRICKS_MODEL_ENDPOINT }}
          MAX_PAGES_PER_WINDOW: ${{ inputs.max_pages_per_window }}
        run: |
          set -euo pipefail

          required_values=(
            DATABRICKS_HOST
            DATABRICKS_CLIENT_ID
            DATABRICKS_CLIENT_SECRET
            DATABRICKS_CATALOG
            DATABRICKS_BRONZE_SCHEMA
            DATABRICKS_SILVER_SCHEMA
            DATABRICKS_MODEL_ENDPOINT
          )

          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Environment variable or secret is missing: $name"
              exit 1
            fi
          done

          if [[ ! "$MAX_PAGES_PER_WINDOW" =~ ^[0-9]+$ ]]; then
            echo "::error::max_pages_per_window must be an integer."
            exit 1
          fi

          if (( MAX_PAGES_PER_WINDOW < 1 || MAX_PAGES_PER_WINDOW > 20 )); then
            echo "::error::max_pages_per_window must be from 1 through 20."
            exit 1
          fi

          echo "Databricks host: $DATABRICKS_HOST"
          echo "Catalog: $DATABRICKS_CATALOG"
          echo "Bronze schema: $DATABRICKS_BRONZE_SCHEMA"
          echo "Silver schema: $DATABRICKS_SILVER_SCHEMA"
          echo "Model endpoint: $DATABRICKS_MODEL_ENDPOINT"
          echo "Maximum pages per window: $MAX_PAGES_PER_WINDOW"
          echo "Required configuration is present."
          echo "Secret values were not displayed."

      - name: Verify Databricks OAuth authentication
        shell: bash
        run: |
          set -euo pipefail
          databricks auth describe
          databricks current-user me --output json

      - name: Validate Databricks bundle
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle validate \
            --target "${{ inputs.environment }}" \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="max_pages_per_window=${{ inputs.max_pages_per_window }}"

      - name: Deploy Databricks bundle
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle deploy \
            --target "${{ inputs.environment }}" \
            --auto-approve \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="max_pages_per_window=${{ inputs.max_pages_per_window }}"

      - name: Run Silver page classification
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle run \
            markdown_silver_page_classification \
            --target "${{ inputs.environment }}" \
            --var="catalog=${{ vars.DATABRICKS_CATALOG }}" \
            --var="bronze_schema=${{ vars.DATABRICKS_BRONZE_SCHEMA }}" \
            --var="silver_schema=${{ vars.DATABRICKS_SILVER_SCHEMA }}" \
            --var="model_endpoint=${{ vars.DATABRICKS_MODEL_ENDPOINT }}" \
            --var="max_pages_per_window=${{ inputs.max_pages_per_window }}"