
name: Deploy and run Silver classification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Databricks target
        required: true
        type: choice
        options:
          - development
          - qa
          - production
        default: development

      classification_job:
        description: Choose classification pipeline
        required: true
        type: choice
        options:
          - maths
          - bible
          - both
        default: maths

      max_pages_per_window:
        description: Maximum related pages per maths AI request (1-20)
        required: true
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: markdown-page-classification-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and run ${{ inputs.classification_job }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Selects the matching GitHub Environment.
    environment: ${{ inputs.environment }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m

      DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
      DATABRICKS_BRONZE_SCHEMA: ${{ vars.DATABRICKS_BRONZE_SCHEMA }}
      DATABRICKS_SILVER_SCHEMA: ${{ vars.DATABRICKS_SILVER_SCHEMA }}
      DATABRICKS_MODEL_ENDPOINT: ${{ vars.DATABRICKS_MODEL_ENDPOINT }}

      TARGET: ${{ inputs.environment }}
      SELECTED_JOB: ${{ inputs.classification_job }}
      MAX_PAGES_PER_WINDOW: ${{ inputs.max_pages_per_window }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Build Python wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate GitHub configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            DATABRICKS_HOST
            DATABRICKS_CLIENT_ID
            DATABRICKS_CLIENT_SECRET
            DATABRICKS_CATALOG
            DATABRICKS_BRONZE_SCHEMA
            DATABRICKS_SILVER_SCHEMA
            DATABRICKS_MODEL_ENDPOINT
          )

          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          if [[ ! "$MAX_PAGES_PER_WINDOW" =~ ^[0-9]+$ ]]; then
            echo "::error::max_pages_per_window must be an integer."
            exit 1
          fi

          if (( MAX_PAGES_PER_WINDOW < 1 ||
                MAX_PAGES_PER_WINDOW > 20 )); then
            echo "::error::max_pages_per_window must be from 1 to 20."
            exit 1
          fi

          case "$SELECTED_JOB" in
            maths|bible|both)
              ;;
            *)
              echo "::error::Unknown classification job: $SELECTED_JOB"
              exit 1
              ;;
          esac

          echo "Databricks host: $DATABRICKS_HOST"
          echo "Catalog: $DATABRICKS_CATALOG"
          echo "Bronze schema: $DATABRICKS_BRONZE_SCHEMA"
          echo "Silver schema: $DATABRICKS_SILVER_SCHEMA"
          echo "Model endpoint: $DATABRICKS_MODEL_ENDPOINT"
          echo "Maximum pages per window: $MAX_PAGES_PER_WINDOW"
          echo "Selected classification job: $SELECTED_JOB"
          echo "Required configuration is present."
          echo "Secret values were not displayed."

      - name: Verify Databricks OAuth authentication
        shell: bash
        run: |
          set -euo pipefail
          databricks auth describe
          databricks current-user me --output json

      - name: Validate Databricks bundle
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle validate \
            --target "$TARGET" \
            --var="catalog=$DATABRICKS_CATALOG" \
            --var="bronze_schema=$DATABRICKS_BRONZE_SCHEMA" \
            --var="silver_schema=$DATABRICKS_SILVER_SCHEMA" \
            --var="model_endpoint=$DATABRICKS_MODEL_ENDPOINT" \
            --var="max_pages_per_window=$MAX_PAGES_PER_WINDOW"

      - name: Deploy Databricks bundle
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle deploy \
            --target "$TARGET" \
            --auto-approve \
            --var="catalog=$DATABRICKS_CATALOG" \
            --var="bronze_schema=$DATABRICKS_BRONZE_SCHEMA" \
            --var="silver_schema=$DATABRICKS_SILVER_SCHEMA" \
            --var="model_endpoint=$DATABRICKS_MODEL_ENDPOINT" \
            --var="max_pages_per_window=$MAX_PAGES_PER_WINDOW"

      - name: Run selected Silver classification
        shell: bash
        run: |
          set -euo pipefail

          bundle_run() {
            databricks bundle run "$1" \
              --target "$TARGET" \
              --var="catalog=$DATABRICKS_CATALOG" \
              --var="bronze_schema=$DATABRICKS_BRONZE_SCHEMA" \
              --var="silver_schema=$DATABRICKS_SILVER_SCHEMA" \
              --var="model_endpoint=$DATABRICKS_MODEL_ENDPOINT" \
              --var="max_pages_per_window=$MAX_PAGES_PER_WINDOW"
          }

          case "$SELECTED_JOB" in
            maths)
              echo "Running mathematics classification..."
              bundle_run markdown_silver_page_classification
              ;;

            bible)
              echo "Running Bible scene classification..."
              bundle_run bible_story_scene_classification
              ;;

            both)
              echo "Running mathematics classification..."
              bundle_run markdown_silver_page_classification

              echo "Running Bible scene classification..."
              bundle_run bible_story_scene_classification
              ;;
          esac