resources:
  jobs:
    markdown_silver_classification:
      name: markdown-silver-classification-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: setup_silver_tables
          environment_key: serverless_environment
          python_wheel_task:
            package_name: markdown_silver_classification
            entry_point: setup-silver-tables
            named_parameters: &parameters
              catalog: ${var.catalog}
              bronze-schema: ${var.bronze_schema}
              silver-schema: ${var.silver_schema}
              model-endpoint: ${var.model_endpoint}
              enable-ai: ${var.enable_ai}
              confidence-threshold: ${var.confidence_threshold}
              prompt-version: ${var.prompt_version}
              max-pages-per-window: ${var.max_pages_per_window}
              window-overlap-pages: ${var.window_overlap_pages}
              max-window-characters: ${var.max_window_characters}
        - task_key: parse_sections
          depends_on:
            - task_key: setup_silver_tables
          environment_key: serverless_environment
          python_wheel_task:
            package_name: markdown_silver_classification
            entry_point: parse-sections
            named_parameters: *parameters
        - task_key: organize_chapters
          depends_on:
            - task_key: parse_sections
          environment_key: serverless_environment
          python_wheel_task:
            package_name: markdown_silver_classification
            entry_point: organize-chapters
            named_parameters: *parameters
        - task_key: verify_silver
          depends_on:
            - task_key: organize_chapters
          environment_key: serverless_environment
          python_wheel_task:
            package_name: markdown_silver_classification
            entry_point: verify-silver
            named_parameters: *parameters
      environments:
        - environment_key: serverless_environment
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
