bundle:
  name: markdown-silver-page-classification

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m build --wheel
    dynamic_version: true

variables:
  catalog:
    default: education_rag
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  model_endpoint:
    default: databricks-gpt-oss-120b
  prompt_version:
    default: v3-page-window-block-ids
  max_pages_per_window:
    default: 5
  confidence_threshold:
    default: 0.70

targets:
  development:
    mode: development
    default: true
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
  qa:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  production:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
