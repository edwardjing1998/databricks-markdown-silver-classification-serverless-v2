bundle:
  name: markdown-silver-classification

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m build --wheel
    dynamic_version: true

variables:
  catalog:
    default: education_rag
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  model_endpoint:
    description: Databricks Model Serving endpoint used by ai_query
    default: system.ai.gpt-oss-20b
  enable_ai:
    description: Must be true for chapter organization and exercise splitting
    default: "true"
  confidence_threshold:
    default: "0.85"
  prompt_version:
    default: v2-windowed
  max_pages_per_window:
    description: Maximum source pages sent to one AI window request
    default: "15"
  window_overlap_pages:
    description: Pages repeated between adjacent windows
    default: "2"
  max_window_characters:
    description: Approximate maximum Markdown characters in one AI request
    default: "40000"

targets:
  development:
    mode: development
    default: true
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
  qa:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  production:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
