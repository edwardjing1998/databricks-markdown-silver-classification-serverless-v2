[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-silver-page-classification"
version = "2.0.0"
description = "Windowed AI classification into Silver fine-grained Markdown pages"
requires-python = ">=3.11"

[project.scripts]
setup-classification-tables = "markdown_classification.setup_tables:main"
classify-page-windows = "markdown_classification.classify_windows:main"
verify-classifications = "markdown_classification.verify_job:main"
setup-bible-tables = "markdown_classification.bible_job:setup_main"
classify-bible-scenes = "markdown_classification.bible_job:classify_main"
verify-bible-scenes = "markdown_classification.bible_job:verify_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"markdown_classification.prompts" = ["*.txt"]
